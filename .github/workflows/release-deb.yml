name: Release deb

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (without leading v). Empty = use short SHA."
        required: false
        default: ""

permissions:
  contents: write

env:
  GTK4_LAYER_SHELL_TAG: "v1.3.0"
  CARGO_TERM_COLOR: always

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.0+${GITHUB_SHA::7}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=$V"

  deb-ubuntu-26-04:
    name: Build metis-desktop .deb (Ubuntu 26.04)
    needs: resolve-version
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      options: --user root
    steps:
      # Minimal tools first — the ubuntu image has no git by default.
      - name: Bootstrap apt tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libclang-dev \
            libgtk-4-dev libadwaita-1-dev \
            libgtk4-layer-shell-dev \
            libudev-dev libinput-dev libseat-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdisplay-info-dev libpam0g-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            liblcms2-dev \
            libwayland-dev wayland-protocols \
            libeis-dev \
            dpkg-dev fakeroot \
            gettext
          pkg-config --atleast-version=4.18 gtk4
          pkg-config --atleast-version=1.0 gtk4-layer-shell-0
          echo "GTK $(pkg-config --modversion gtk4), layer-shell $(pkg-config --modversion gtk4-layer-shell-0)"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: metis-os-workspace -> target
          shared-key: ubuntu-26.04

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo deny
        working-directory: metis-os-workspace
        run: cargo deny check

      - name: Build release binaries + package .deb
        working-directory: metis-os-workspace
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          DISTRO_SUITE: ubuntu26.04
          BUNDLE_GTK4_LAYER_SHELL: "0"
          CARGO_TARGET_DIR: ${{ github.workspace }}/metis-os-workspace/target
          METIS_CARGO_TARGET_DIR: ${{ github.workspace }}/metis-os-workspace/target
        run: |
          ./scripts/package-deb.sh
          ls -lh dist/*.deb
          test "$(dpkg-deb -c dist/*.deb | grep -c 'usr/share/metis/locale/.*/metis\.mo$')" -ge 2
          test "$(dpkg-deb -c dist/*.deb | grep -c 'usr/share/metis/locale/.*/metis\.ftl$')" -ge 2

      - uses: actions/upload-artifact@v4
        with:
          name: metis-deb-ubuntu26.04
          path: metis-os-workspace/dist/*.deb
          if-no-files-found: error

  deb-debian-13:
    name: Build metis-desktop .deb (Debian 13)
    needs: resolve-version
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --user root
    steps:
      # Minimal tools first — debian:trixie has no git by default.
      - name: Bootstrap apt tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libclang-dev \
            libgtk-4-dev libadwaita-1-dev \
            libgtk4-layer-shell-dev \
            libudev-dev libinput-dev libseat-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdisplay-info-dev libpam0g-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            liblcms2-dev \
            libwayland-dev wayland-protocols \
            libeis-dev \
            libgirepository1.0-dev gobject-introspection \
            meson ninja-build valac \
            dpkg-dev fakeroot \
            gettext
          if pkg-config --exists gtk4-layer-shell-0 2>/dev/null; then
            echo "BUNDLE_LAYER=0" >> "$GITHUB_ENV"
            pkg-config --modversion gtk4-layer-shell-0
          else
            ./metis-os-workspace/scripts/fetch-gtk4-layer-shell.sh /tmp/gtk4-layer-shell
            cd /tmp/gtk4-layer-shell
            meson setup build --prefix=/usr/local -Dexamples=false -Ddocs=false -Dtests=false
            ninja -C build && ninja -C build install && ldconfig
            echo "PKG_CONFIG_PATH=/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"
            echo "BUNDLE_LAYER=1" >> "$GITHUB_ENV"
            pkg-config --modversion gtk4-layer-shell-0
          fi

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-deny
        run: |
          . "$HOME/.cargo/env"
          cargo install cargo-deny --locked

      - name: cargo deny
        working-directory: metis-os-workspace
        run: |
          . "$HOME/.cargo/env"
          cargo deny check

      - name: Build release binaries + package .deb
        working-directory: metis-os-workspace
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          DISTRO_SUITE: debian13
          BUNDLE_GTK4_LAYER_SHELL: ${{ env.BUNDLE_LAYER }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/metis-os-workspace/target
          METIS_CARGO_TARGET_DIR: ${{ github.workspace }}/metis-os-workspace/target
        run: |
          . "$HOME/.cargo/env"
          ./scripts/package-deb.sh
          ls -lh dist/*.deb
          test "$(dpkg-deb -c dist/*.deb | grep -c 'usr/share/metis/locale/.*/metis\.mo$')" -ge 2
          test "$(dpkg-deb -c dist/*.deb | grep -c 'usr/share/metis/locale/.*/metis\.ftl$')" -ge 2

      - uses: actions/upload-artifact@v4
        with:
          name: metis-deb-debian13
          path: metis-os-workspace/dist/*.deb
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [resolve-version, deb-ubuntu-26-04, deb-debian-13]
    if: |
      always() &&
      needs.deb-ubuntu-26-04.result == 'success' &&
      needs.deb-debian-13.result == 'success' &&
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: metis-deb-*
          merge-multiple: true
        continue-on-error: true

      - name: List artifacts
        run: find artifacts -type f -name '*.deb' -ls || true

      - name: Require at least one .deb
        run: |
          test "$(find artifacts -type f -name '*.deb' | wc -l)" -ge 1

      - name: Publish GitHub Release (tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.deb
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish GitHub prerelease (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.sha }}
          name: Test build ${{ github.sha }}
          prerelease: true
          files: artifacts/*.deb
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            Manual workflow_dispatch multi-suite build.

            ```bash
            # Ubuntu 26.04+
            sudo apt install ./metis-desktop_${{ needs.resolve-version.outputs.version }}-1_amd64.ubuntu26.04.deb
            # Debian 13+
            sudo apt install ./metis-desktop_${{ needs.resolve-version.outputs.version }}-1_amd64.debian13.deb
            ```
            Then log out and pick **Metis** at the greeter.
