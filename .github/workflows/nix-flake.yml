# Nix flake check (no full graphical session).
name: Nix flake

on:
  push:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "metis-os-workspace/Cargo.lock"
      - "metis-os-workspace/**/Cargo.toml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
  workflow_dispatch:

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v16 used a 1000ms HTTP timeout that flakes on slow GitHub→installer fetches
      # (TimeoutError / ETIMEDOUT). Keep upstream Nix (not Determinate defaults).
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: flake check
        run: |
          # Evaluate / build packages (may take long on cold cache).
          nix flake check --print-build-logs
        continue-on-error: true
      - name: evaluate package
        run: nix eval .#packages.x86_64-linux.metis-desktop.name
