name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs on the support floor (Debian 13: GTK 4.18, gtk4-layer-shell 1.0,
  # PipeWire 1.4). Newer targets (Ubuntu 26.04, Arch, NixOS) only move up.
  quality:
    name: fmt · clippy · test · deny (Debian 13 floor)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --user root
    defaults:
      run:
        working-directory: metis-os-workspace
    steps:
      # debian:trixie has no git/curl by default.
      - name: Bootstrap apt tools
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libclang-dev \
            libgtk-4-dev libadwaita-1-dev \
            libgtk4-layer-shell-dev \
            libudev-dev libinput-dev libseat-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdisplay-info-dev libpam0g-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            liblcms2-dev \
            libwayland-dev wayland-protocols \
            libeis-dev \
            gettext

      - name: Check support-floor versions
        run: |
          echo "GTK $(pkg-config --modversion gtk4), layer-shell $(pkg-config --modversion gtk4-layer-shell-0)"
          pkg-config --atleast-version=4.18 gtk4
          pkg-config --atleast-version=1.0 gtk4-layer-shell-0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: metis-os-workspace -> target
          shared-key: ci-debian-13

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo deny
        run: cargo deny check

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
