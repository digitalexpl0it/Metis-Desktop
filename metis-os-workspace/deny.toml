# cargo-deny — supply-chain gate (CI: `cargo deny check` from metis-os-workspace/)
#
# Failures that land new duplicate crate versions or new unignored advisories
# must be fixed by upgrading, or by explicitly adding a skip/ignore with a reason.
# Prefer shrinking `[bans.skip]` and `[advisories.ignore]` over growing them
# (Smithay / reed-solomon / rustybuzz / opus bumps are the usual unlocks).

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
# cargo-deny 0.20: unmaintained/unsound are scopes (none|workspace|transitive|all),
# not warn/deny lints. Hits are errors; known blockers are listed under ignore.
unmaintained = "all"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste via pixman←smithay git; wait for Smithay" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via fontdue/rustybuzz; no safe upgrade yet" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz direct in compositor; migrate when ready" },
    { id = "RUSTSEC-2026-0150", reason = "audiopus_sys via opus 0.3; track opus/sys fork" },
    { id = "RUSTSEC-2024-0384", reason = "instant via reed-solomon-erasure parking_lot 0.11" },
    { id = "RUSTSEC-2026-0253", reason = "lru@0.7 unsound via reed-solomon-erasure; panic=abort mitigates unwind UAF" },
]

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
    # ffmpeg-next / ffmpeg-sys-next (system libav bindings for RUDP encode).
    "WTFPL",
]

# ical 0.11 publishes without a license field; upstream is MIT
# (https://github.com/Peltoche/ical-rs).
[[licenses.clarify]]
name = "ical"
version = "*"
expression = "MIT"
license-files = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "allow"
allow-wildcard-paths = true
# Snapshot of Cargo.lock duplicates (2026-10-10). Skip older/extra versions so
# only the newest of each crate remains under the deny check.
skip = [
    { crate = "base64@0.22.1", reason = "transitive dual; prefer 0.23" },
    { crate = "chacha20@0.9.1", reason = "crypto stack dual" },
    { crate = "cpufeatures@0.2.17", reason = "crypto stack dual" },
    { crate = "foldhash@0.1.5", reason = "hashbrown stack dual" },
    { crate = "getrandom@0.2.17", reason = "rand 0.8 path" },
    { crate = "hashbrown@0.12.3", reason = "indexmap/older consumers" },
    { crate = "hashbrown@0.15.5", reason = "mid stack until unified" },
    { crate = "linux-raw-sys@0.4.15", reason = "rustix 0.38 path" },
    { crate = "linux-raw-sys@0.9.4", reason = "mid rustix path" },
    { crate = "miniz_oxide@0.8.9", reason = "image/flate dual" },
    { crate = "nix@0.30.1", reason = "smithay/native stack lag" },
    { crate = "nom@7.1.3", reason = "older parser consumer" },
    { crate = "parking_lot@0.11.2", reason = "reed-solomon-erasure" },
    { crate = "parking_lot_core@0.8.6", reason = "reed-solomon-erasure" },
    { crate = "quick-xml@0.41.0", reason = "wayland-scanner/smithay pin" },
    { crate = "rand@0.8.8", reason = "legacy rand consumers" },
    { crate = "rand@0.9.5", reason = "mid rand stack" },
    { crate = "rand_core@0.6.4", reason = "legacy rand" },
    { crate = "rand_core@0.9.5", reason = "mid rand" },
    { crate = "rustix@0.38.44", reason = "smithay/nix-adjacent" },
    { crate = "shlex@1.3.0", reason = "older build-dep path" },
    { crate = "syn@2.0.119", reason = "proc-macro dual with syn 3" },
    { crate = "system-deps@7.0.8", reason = "gtk/sys build scripts" },
    { crate = "system-deps@8.0.0", reason = "gtk/sys build scripts" },
    { crate = "thiserror@1.0.69", reason = "ical + pixman(smithay)" },
    { crate = "thiserror-impl@1.0.69", reason = "paired with thiserror 1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/Smithay/smithay",
]
