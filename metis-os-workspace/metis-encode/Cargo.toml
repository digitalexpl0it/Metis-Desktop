[package]
name = "metis-encode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Metis RUDP video encode (VAAPI + NVENC + software AV1 via FFmpeg)"

[dependencies]
libc = "0.2"
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }
# System FFmpeg (libavcodec) — VAAPI/NVENC encoders + swscale upload path.
# `filter` enables libavfilter for Phase 24 E zero-copy VPP (scale_vaapi / scale_cuda).
ffmpeg-next = { version = "8", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling", "filter"] }
