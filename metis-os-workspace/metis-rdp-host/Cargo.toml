[package]
name = "metis-rdp-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Metis-native RDP host — portal ScreenCast capture + FreeRDP shadow server"

[[bin]]
name = "metis-rdp-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ashpd = { version = "0.13", default-features = false, features = ["screencast", "tokio"] }
enumflags2 = "0.7"
futures-util = "0.3"
libc = "0.2"
memmap2 = "0.9"
metis-config = { workspace = true }
metis-protocol = { workspace = true }
nix = { version = "0.30", features = ["fs", "socket", "uio"] }
pipewire = { version = "0.10", features = ["v0_3_34"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
