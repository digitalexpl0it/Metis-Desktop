[package]
name = "metis-rudp-smoke"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Metis Remote (RUDP) auth + video smoke client (TOFU + PAM + datagrams)"

[[bin]]
name = "metis-rudp-smoke"
path = "src/main.rs"

[dependencies]
metis-protocol = { workspace = true }
metis-rudp-client = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
zeroize = "1"
