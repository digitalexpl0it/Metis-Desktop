[package]
name = "metis-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Metis RDP viewer — GTK connect UI over FreeRDP (GRD host unchanged)"

[[bin]]
name = "metis-viewer"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
glib = "0.22"
gio = "0.22"
metis-config = { workspace = true }
metis-i18n = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = "1"
