[package]
name = "metis-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Metis Viewer — RDP (FreeRDP) and Metis Remote (RUDP) client"

[[bin]]
name = "metis-viewer"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
glib = "0.22"
gio = "0.22"
metis-config = { workspace = true }
metis-i18n = { workspace = true }
metis-protocol = { workspace = true }
metis-rudp-client = { workspace = true }
metis-decode = { workspace = true }
metis-secrets = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
zeroize = "1"
