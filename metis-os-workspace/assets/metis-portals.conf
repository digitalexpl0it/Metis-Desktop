[preferred]
# GTK covers file dialogs, notifications, etc. Metis implements Settings + capture.
default=gtk
org.freedesktop.impl.portal.Settings=metis
org.freedesktop.impl.portal.Screenshot=metis
org.freedesktop.impl.portal.ScreenCast=metis
org.freedesktop.impl.portal.Background=metis
org.freedesktop.impl.portal.PowerProfileMonitor=metis
# Session credentials use org.freedesktop.secrets (metis-secretsd by default).
# Portal Secret (sandboxed encrypt key) is intentionally unpinned — residual.
