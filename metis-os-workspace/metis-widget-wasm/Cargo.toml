[package]
name = "metis-widget-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sandboxed Wasmtime host for Metis desktop widget packs (Extension API v2 / M7)"

[dependencies]
metis-config = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# >=36.0.21: RUSTSEC-2026-0566 / 0569 / 0571 (GHSA wasmtime-wasi / get_module_export / wasi-http)
wasmtime = { version = ">=36.0.21, <37", default-features = false, features = [
    "cranelift",
    "runtime",
    "gc-null",
] }

[dev-dependencies]
wat = "1"
