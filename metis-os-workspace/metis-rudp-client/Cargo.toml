[package]
name = "metis-rudp-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Metis Remote (RUDP) Quinn client session (TOFU + auth + video + input)"

[dependencies]
metis-config = { workspace = true }
metis-protocol = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "sync"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
bytes = "1"
